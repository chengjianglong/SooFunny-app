name: SooFunny
options:
  bundleIdPrefix: com.chengjianglong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SooFunny:
    type: application
    platform: iOS
    sources: [SooFunny]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjianglong.soofunny
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SooFunny
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "SooFunny uses the camera so you can snap a picture and color it in."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "SooFunny saves your colored pictures to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Image processing is ~100x slower unoptimized; keep it snappy when run from Xcode.
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  SooFunnyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SooFunnyTests]
    dependencies:
      - target: SooFunny
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjianglong.soofunny.tests
schemes:
  SooFunny:
    build:
      targets:
        SooFunny: all
    test:
      targets: [SooFunnyTests]
