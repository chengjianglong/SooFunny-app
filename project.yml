name: SooFunny
options:
  bundleIdPrefix: com.chengjianglong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SooFunny:
    type: application
    platform: iOS
    sources:
      - path: SooFunny
        excludes:
          - "Store/SooFunny.storekit"
      # The on-device Gemma model (806 MB). Not in git: run scripts/fetch_model.sh.
      - path: Models/gemma-3-1b-it-Q4_K_M.gguf
        buildPhase: resources
        optional: true
    dependencies:
      # llama.cpp built for iOS. Not in git: run scripts/build_llama.sh.
      - framework: Vendor/llama.cpp-src/build-apple/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjianglong.soofunny
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SooFunny
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Soo Intelligence Inc. All rights reserved."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "SooFunny uses the camera so you can snap a picture and color it in."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SooFunny listens when you tap Talk, so you can ask questions about a word."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "SooFunny turns what you say into words on this device, so the buddy can answer your questions."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "SooFunny saves your colored pictures to your photo library."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Image processing is ~100x slower unoptimized; keep it snappy when run from Xcode.
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          # Developer unlock: Premium is on in Debug builds only. Never add this to Release.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEV_UNLOCK"
  SooFunnyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SooFunnyTests
      # Lets StoreKitTest run real purchase flows in unit tests.
      - path: SooFunny/Store/SooFunny.storekit
        buildPhase: resources
    dependencies:
      - target: SooFunny
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chengjianglong.soofunny.tests
schemes:
  SooFunny:
    build:
      targets:
        SooFunny: all
    run:
      # Test purchases in the Simulator when running from Xcode.
      storeKitConfiguration: SooFunny/Store/SooFunny.storekit
    test:
      targets: [SooFunnyTests]
